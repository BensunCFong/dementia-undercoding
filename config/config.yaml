# Full MIMIC-IV v3.1 + MIMIC-IV-Note v2.2, under the credentialed PhysioNet DUA.
# For the open-access 100-patient demo, use config/config.demo.yaml instead.

paths:
  # icu/ is not downloaded and not needed.
  mimic_hosp: "data/raw/mimic-iv-3.1/hosp"
  mimic_note: "data/raw/mimic-iv-note-2.2/note"
  # Everything the pipeline writes lands under derived/, never stdout.
  # data/ is gitignored in full, so nothing here can reach the repo.
  derived: "data/derived"
  duckdb: "data/derived/cohort.duckdb"
  notes: "data/derived/notes.parquet"     # modelling dataset, from dataset.build()
  scores: "data/derived/scores"          # per-note validation scores from each arm (hadm_id, score)

files:
  # Filenames relative to the paths above, declared here rather than built
  # by string concatenation in code, so the shard globs are visible.
  #
  # These were exported from BigQuery via `bq extract` rather than pulled
  # from physionet.org directly (PhysioNet was serving at ~160 KB/s).
  # BigQuery refuses single-file exports over 1 GB, so prescriptions and
  # discharge arrive sharded as -000000000000, -000000000001, ... DuckDB
  # globs these natively; read_csv takes the pattern as-is.
  hosp:
    patients: "patients.csv.gz"
    admissions: "admissions.csv.gz"
    diagnoses_icd: "diagnoses_icd.csv.gz"
    d_icd_diagnoses: "d_icd_diagnoses.csv.gz"
    services: "services.csv.gz"
    prescriptions: "prescriptions-*.csv.gz"     # 100 shards
  note:
    discharge: "discharge-*.csv.gz"             # 7 shards
    discharge_detail: "discharge_detail.csv.gz"

cohort:
  min_age: 18
  note_type: "DS"      # discharge summaries

split:
  # Copied VERBATIM from patients.anchor_year_group. The values are
  # space-separated around the hyphen: "2011 - 2013", not "2011-2013".
  # Verified against the data: every band is LENGTH 11.
  #
  # v3.1 contains FIVE bands. Every one of them must appear in exactly one of
  # train / test / exclude below. The cohort build asserts this in BOTH
  # directions: configured bands must exist in patients, AND observed bands
  # must be accounted for here. A band present in the data but missing from
  # this config would otherwise fall through to 'excluded' silently, which is
  # how 2020 - 2022 nearly disappeared without a decision being made.
  train: ["2008 - 2010", "2011 - 2013"]
  test:  ["2017 - 2019"]
  exclude:
    "2014 - 2016": >-
      Straddles the ICD-9 to ICD-10 transition (US switchover October 2015).
      Held out to keep the temporal contrast clean rather than harmonised away.
      Note: bands belong to patients, so train patients' later admissions still
      reach past 2015; train is about 19% ICD-10.
    "2020 - 2022": >-
      Present in MIMIC-IV v3.1 but not in MIMIC-IV-Note v2.2, which was built
      against MIMIC-IV v2.2. Exactly 1 admission in this band has a discharge
      summary, so there is no text for any arm to read. Excluded on data
      coverage, not on the COVID confound - though that would also apply.
  validation:
    # Carved out of TRAIN, never test. Drawn by patient (subject_id), not by
    # admission: patients average about two admissions in train, and notes
    # copy history forward, so an admission-level draw would grade the model
    # on text it had effectively seen. Plain random draw, no stratification.
    # Decided 2026-10-05: compared seeds 1-4 on age, sex, core / broad /
    # delirium rates, ICD-10 share (~19% of train) and note length. All four
    # were close to train overall; seed 3 was closest on most of them.
    frac: 0.1
    seed: 3

label:
  # No "set" key by design. core and broad are materialised as separate
  # boolean columns on the cohort table, and the arms choose a column at
  # train time. A config switch here would mean two runs that differ
  # invisibly, and a sensitivity analysis you cannot see side by side.
  #
  # Prevalence check (cohort.assert_prevalence): coded dementia_core among
  # admissions aged 65+, per split. A guard on the ICD matching, not a
  # hypothesis. The lower bound is the one that matters: broken matching
  # drives the rate toward zero. The upper bound only catches a code set that
  # has grown far too broad.
  #
  # Why 65+ and not all adults: over half the cohort is under 65, where coded
  # dementia is near zero, so the all-adult rate (3.9-4.7% by split) is mostly
  # an age-mix number. The earlier "5-9%" expectation was never sourced.
  # First full build, 2026-10-03, 65+ only: train 7.81%, test 9.79%,
  # exclude 9.59%. The splits differ in era, coding system and follow-up at
  # once, so the gap is not evidence that ICD-10 itself codes more dementia.
  prevalence_check:
    min_age: 65
    core_range: [0.05, 0.15]

# --- decided after hardware sizing (M1 Max, 32GB unified) ---
sample:
  # The dataset keeps every train and test note; nothing is sampled when it
  # is built. Decided 2026-10-03: fine-tuning may run over several nights with
  # daytime pauses, so the earlier 50k cap (set to fit one overnight run) is
  # lifted. n is a cap on TRAINING notes only, applied at training time; the
  # full test set is always used. null = all. Revisit after timing a batch.
  n: null
  seed: 20260821

tokens:
  # Truncation FIRST, for pipeline reasons rather than accuracy reasons:
  # chunking multiplies compute 4-8x and forces a pooling decision (max?
  # mean? any-chunk-positive?) that materially moves the false positive
  # rate on a ~4% positive class. Get the pipeline green on truncate,
  # then run chunk as the measured comparison. If the tail carries signal
  # it will show up there.
  strategy: "truncate"   # "truncate" or "chunk"
  max_len: 512
  stride: 128

mlflow:
    # Local SQLite backend under data/ (gitignored). MLflow 3.x refuses the
  # old file:./mlruns store without an opt-out, so it is not used.
  # Set azure_ml_uri to log runs to a personal Azure ML workspace instead
  # (free to create, compute unused).
  # METRICS AND PARAMS ONLY. Never log note text or sample predictions:
  # the DUA prohibits sending clinical text to third-party services.
  tracking_uri: "sqlite:///data/derived/mlflow.db"
  azure_ml_uri: null
  experiment: "dementia-undercoding"

arm0:
  # Regex baseline. Every rule fixed 2026-11-07, before any note was read; see arm0_regex.py.
  window: 6                 # NegEx-style scope: at most this many words between trigger and term
  uncertain_weight: 0.5     # "concern for dementia" counts half; a judgement call, not tuned


arm1b:
  # LightGBM on arm 1's TF-IDF features. Every setting fixed 2026-11-08, before any result.
  inner_frac: 0.1           # slice of TRAIN patients used only for early stopping; validation never is
  inner_seed: 20261108
  max_trees: 2000
  patience: 50              # stop when inner-slice PR-AUC has not improved for this many trees
  learning_rate: 0.1        # LightGBM defaults from here down
  num_leaves: 31
  min_child_samples: 20
  seed: 20261108

lora:
  # Arm 2. Decided 2026-11-07, before any LoRA result was seen.
  model: "emilyalsentzer/Bio_ClinicalBERT"
  max_len: 512
  main:
    r: 8
    alpha: 16
    dropout: 0.1
    target_modules: ["query", "value"]
  # Pre-declared fallback: runs only if the main run's validation PR-AUC is
  # below fallback_trigger (arm 1's 0.730 + about 0.03 rough noise). Changes
  # rank only; alpha moves with it (alpha = 2r) so opacity per layer is unchanged.
  fallback:
    r: 12
    alpha: 24
    dropout: 0.1
    target_modules: ["query", "value"]
  fallback_trigger: 0.76
  # Truncation follow-up (--window head_tail). Chosen 2026-11-08 AFTER the main score (0.768) and the
  # paired bootstrap (LightGBM ahead by +0.023 [+0.002, +0.045]) were seen. Evidence: arm 0 on the
  # first 512 tokens lost 0.050 of PR-AUC; on head 128 + tail 382 it kept 0.621 of 0.622 (truncation.py).
  head_tail:
    head: 128                       # first 128 tokens + last 382: 510, plus [CLS] and [SEP]
  out_dir: "data/derived/arm2"      # trained adapters; under data/, never logged to MLflow
  train:
    label: "dementia_core"
    batch_size: 16
    passes: 2
    learning_rate: 2.0e-4
    warmup_frac: 0.06               # first 6% of steps ramp the learning rate up from zero
    max_grad_norm: 1.0              # cap on any single nudge
    seed: 20261107
    health_check_train_n: 20000     # train notes scored after training, for the train-vs-validation gap


compare:
  # Patient-level paired bootstrap (evaluate.compare). Fixed 2026-11-08, before any interval was seen.
  reference: "arm 2 LoRA main"    # every other arm's difference is measured against this one
  n_boot: 2000                    # resamples; enough for stable 95% percentile intervals
  seed: 20261108
  ci: 0.95

arm3:
  # Prompted local LLM via llama.cpp (arm3_llm.py). Fixed 2026-11-08, before any arm 3 score.
  models:
    medgemma-1.5-4b:
      path: "~/models/gguf/medgemma-1.5-4b-it-Q4_K_M.gguf"
      prefill: "<unused94>thought\n<unused95>"   # MedGemma 1.5 thinks first: close the thought, then it answers
    qwen3.5-9b:
      path: "~/models/gguf/Qwen3.5-9B-Q4_K_M.gguf"
      prefill: ""                               # thinking switched off through the chat template instead
  port: 8089
  ctx: 16384                  # tokens the server holds: examples + the longest note
  max_note_chars: 40000       # longer notes are cut (counted and reported); about 10,000 tokens
  sample_seed: 20261108       # for --n: the same sample of validation notes for every model
  examples:
    n_pos: 2                  # real TRAIN notes with the dementia_core code
    n_neg: 2                  # real TRAIN notes without it, and with arm 0 score 0
    max_chars: 1600           # short notes only: about 400 tokens each
    seed: 20261108